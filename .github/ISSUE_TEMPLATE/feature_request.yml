name: Feature request
description: Something Qiyas should do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. The AutoCAD or other command you know it from helps.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Drawings, screenshots, the BOQ format you use.
