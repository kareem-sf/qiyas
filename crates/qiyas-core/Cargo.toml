[package]
name = "qiyas-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
opencadcodec.workspace = true
opencadkernel.workspace = true
qiyas-geom = { path = "../qiyas-geom" }
qiyas-pdf = { path = "../qiyas-pdf" }
qiyas-render = { path = "../qiyas-render" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Integration tests don't see the library's cfg(test), so they turn the fixtures on this way.
qiyas-core = { path = ".", features = ["fixtures"] }
qiyas-pdf = { path = "../qiyas-pdf", features = ["fixtures"] }
qiyas-render = { path = "../qiyas-render" }

[features]
fixtures = []
