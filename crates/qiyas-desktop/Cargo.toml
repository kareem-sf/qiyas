[package]
name = "qiyas-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "qiyas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
qiyas-ai = { path = "../qiyas-ai" }
qiyas-boq = { path = "../qiyas-boq" }
qiyas-core = { path = "../qiyas-core" }
qiyas-pdf = { path = "../qiyas-pdf" }
qiyas-plot = { path = "../qiyas-plot" }
qiyas-takeoff = { path = "../qiyas-takeoff" }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The OS keychain: macOS Keychain, Windows Credential Manager, Secret Service on Linux (the
# `v1` default features). `keyring-core` is the API those stores plug into, and its mock store
# keeps the tests off the real keychain.
keyring = "4"
keyring-core = "1"
getrandom = "0.4"
# The assistant's turn runs on Tauri's tokio runtime: a channel for its events, and a token to
# cancel it.
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
# The system clipboard for COPYCLIP and PASTECLIP (MIT OR Apache-2.0): text only, on Wayland
# through its data-control protocol, else X11.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
tempfile = { workspace = true }
# The IPC tests run the commands on Tauri's mock runtime, on the sample drawing.
tauri = { workspace = true, features = ["test"] }
qiyas-core = { path = "../qiyas-core", features = ["fixtures"] }
qiyas-pdf = { path = "../qiyas-pdf", features = ["fixtures"] }
